<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sống Khỏe & Ẩm Thực - Tạp Chí Đời Sống</title>
  
  <!-- Font chữ báo chí hiện đại -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1a4d2e;
      --primary-hover: #143d24;
      --accent: #e8f5e9;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e5e7eb;
      --serif-font: 'Merriweather', Georgia, serif;
      --sans-font: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans-font);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* HEADER BÁO CHÍ */
    header {
      background-color: #fff;
      border-bottom: 3px double var(--border-color);
      padding: 24px 0 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .masthead h1 {
      font-family: var(--serif-font);
      font-size: 2.5rem;
      letter-spacing: -1px;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 700;
    }

    .masthead p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* THANH CÔNG CỤ: TÌM KIẾM & DANH MỤC */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 24px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .category-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .search-box input {
      padding: 10px 18px;
      border: 1px solid var(--border-color);
      border-radius: 99px;
      font-size: 0.9rem;
      width: 260px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    /* LƯỚI TIN TỨC */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
      padding: 36px 0 60px;
    }

    .article-card {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .article-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.08);
    }

    .card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-category {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      background-color: var(--accent);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    .card-title {
      font-family: var(--serif-font);
      font-size: 1.25rem;
      line-height: 1.4;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
    }

    .card-summary {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 18px;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tips {
      background: #fafaf9;
      border-left: 3px solid #f59e0b;
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 0.8rem;
      color: #78350f;
      margin-bottom: 18px;
    }

    .card-btn {
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* MODAL ĐỌC CHI TIẾT BÀI BÁO */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #fff;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      border-radius: 16px;
      overflow-y: auto;
      padding: 40px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-close {
      position: sticky;
      top: -20px;
      float: right;
      background: #f3f4f6;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: #e5e7eb;
      color: #000;
    }

    .modal-category {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .modal-title {
      font-family: var(--serif-font);
      font-size: 2rem;
      line-height: 1.3;
      margin-bottom: 20px;
      color: #111;
    }

    .modal-tips {
      background: #fef3c7;
      border-left: 4px solid #d97706;
      padding: 16px;
      border-radius: 6px;
      color: #92400e;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .modal-body {
      font-family: var(--serif-font);
      font-size: 1.05rem;
      line-height: 1.8;
      color: #27272a;
      white-space: pre-line; /* Hiển thị ngắt đoạn theo \n\n chuẩn */
    }

    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .masthead h1 { font-size: 1.8rem; }
      .news-grid { grid-template-columns: 1fr; }
      .modal-content { padding: 24px; }
      .modal-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container masthead">
      <h1>Sức Khỏe & Ẩm Thực</h1>
      <p>Bản Tin Đời Sống Tổng Hợp Mỗi Ngày</p>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <div class="category-filters">
        <button class="filter-btn active" onclick="filterCategory('Tất cả')">Tất cả</button>
        <button class="filter-btn" onclick="filterCategory('Y học đời sống')">Y học đời sống</button>
        <button class="filter-btn" onclick="filterCategory('Dinh dưỡng')">Dinh dưỡng</button>
        <button class="filter-btn" onclick="filterCategory('Mẹo sống khỏe')">Mẹo sống khỏe</button>
        <button class="filter-btn" onclick="filterCategory('Ẩm thực & Món ngon')">Ẩm thực</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm tin tức..." oninput="handleSearch()">
      </div>
    </div>

    <div id="articlesList" class="news-grid">
      <!-- Dữ liệu bài viết sẽ được đổ vào đây -->
      <div class="empty-state">Đang nạp bản tin mới nhất...</div>
    </div>
  </main>

  <!-- Modal Chi Tiết Bài Báo -->
  <div id="articleModal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modalCategory" class="modal-category"></div>
      <h2 id="modalTitle" class="modal-title"></h2>
      <div id="modalTips" class="modal-tips"></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    // Cấu hình Supabase (Khớp với mã dự án hiện tại của bạn)
    const SUPABASE_URL = "https://lleeibzegmnycuingzgx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsZWVpYnplZ21ueWN1aW5nemd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjc5OTUsImV4cCI6MjEwNTcwMzk5NX0.KrO8Y8qoKh0NIPYDL6wki7zGb-Lxi1xwWgQrX9xSXxE";

    let allArticles = [];
    let currentCategory = 'Tất cả';

    async function fetchArticles() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/articles?select=*&order=id.desc`, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) throw new Error("Không thể tải tin tức");
        allArticles = await response.json();
        renderArticles(allArticles);
      } catch (err) {
        document.getElementById("articlesList").innerHTML = `
          <div class="empty-state">Không thể kết nối máy chủ tin tức. Vui lòng thử lại sau.</div>
        `;
      }
    }

    function renderArticles(articles) {
      const container = document.getElementById("articlesList");
      
      if (!articles || articles.length === 0) {
        container.innerHTML = `<div class="empty-state">Không tìm thấy bài viết nào phù hợp.</div>`;
        return;
      }

      container.innerHTML = articles.map(art => `
        <article class="article-card" onclick="openModal(${art.id})">
          <div class="card-body">
            <span class="card-category">${escapeHtml(art.category || 'Tin tức')}</span>
            <h2 class="card-title">${escapeHtml(art.title)}</h2>
            <p class="card-summary">${escapeHtml(art.summary || '')}</p>
            ${art.tips ? `<div class="card-tips"><strong>Lời khuyên:</strong> ${escapeHtml(art.tips)}</div>` : ''}
            <span class="card-btn">Đọc toàn bộ bài viết &rarr;</span>
          </div>
        </article>
      `).join('');
    }

    function openModal(id) {
      const article = allArticles.find(a => a.id === id);
      if (!article) return;

      document.getElementById("modalCategory").innerText = article.category || "Tin tức";
      document.getElementById("modalTitle").innerText = article.title;
      
      const tipsBox = document.getElementById("modalTips");
      if (article.tips) {
        tipsBox.style.display = "block";
        tipsBox.innerHTML = `<strong>💡 Lời khuyên dinh dưỡng/sức khỏe:</strong><br>${escapeHtml(article.tips)}`;
      } else {
        tipsBox.style.display = "none";
      }

      // Ưu tiên hiển thị cột 'content' cào trọn bài, nếu bài cũ chưa có thì dùng tạm 'summary'
      document.getElementById("modalBody").innerText = article.content || article.summary;

      document.getElementById("articleModal").classList.add("active");
      document.body.style.overflow = "hidden"; // Khóa thanh cuộn trang chính khi đọc
    }

    function closeModal() {
      document.getElementById("articleModal").classList.remove("active");
      document.body.style.overflow = "auto";
    }

    function handleOverlayClick(event) {
      if (event.target.id === "articleModal") {
        closeModal();
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText === cat);
      });

      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = allArticles.filter(art => {
        const matchCategory = (currentCategory === 'Tất cả') || (art.category === currentCategory);
        const matchSearch = art.title.toLowerCase().includes(query) || 
                            (art.summary && art.summary.toLowerCase().includes(query));
        return matchCategory && matchSearch;
      });

      renderArticles(filtered);
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Đóng popup bằng phím ESC
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // Tự động tải tin tức khi nạp trang
    fetchArticles();
  </script>
</body>
</html>
