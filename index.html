<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeLife - Món Ngon Mỗi Ngày & Sống Khỏe Hiện Đại</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --accent: #f97316;
      --accent-light: #fff7ed;
      --text-main: #0f172a;
      --text-sub: #475569;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 20px 30px -10px rgba(0, 0, 0, 0.15);
      --font-heading: 'Outfit', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    /* HEADER */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      background-color: rgba(255, 255, 255, 0.95);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary), #06b6d4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.4rem;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    }

    .brand-text h1 {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 0.75rem;
      color: var(--primary-dark);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .search-box {
      position: relative;
      width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 18px;
      border-radius: 99px;
      border: 1px solid var(--border-color);
      background-color: #f1f5f9;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s ease;
      font-family: var(--font-body);
    }

    .search-box input:focus {
      background-color: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }

    /* CONTAINER */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* BANNER TƯƠI SÁNG */
    .hero-banner {
      background: linear-gradient(135deg, #059669, #0d9488, #0284c7);
      border-radius: 24px;
      padding: 40px;
      margin: 28px 0;
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }

    .hero-banner h2 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero-banner p {
      font-size: 1.05rem;
      opacity: 0.95;
      max-width: 650px;
    }

    /* THANH LỌC CHUYÊN MỤC */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .filter-btn {
      padding: 10px 20px;
      border-radius: 99px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-sub);
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .filter-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    /* LƯỚI TIN TỨC */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 28px;
      margin-bottom: 60px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .card-thumb-wrap {
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: #e2e8f0;
      position: relative;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover .card-thumb {
      transform: scale(1.05);
    }

    .card-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: var(--shadow-sm);
    }

    .card-badge.cook {
      color: #ea580c;
      background: #fff7ed;
    }

    .card-content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .card-summary {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .card-advice {
      background: var(--accent-light);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #9a3412;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .card-action {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-dark);
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* MODAL ĐỌC BÀI */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: #ffffff;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      border-radius: 24px;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-close-icon {
      position: sticky;
      top: 16px;
      right: 16px;
      float: right;
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      transition: all 0.2s ease;
      z-index: 10;
    }

    .modal-close-icon:hover {
      background: #f1f5f9;
      color: #000;
    }

    .modal-cover {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: none;
    }

    .modal-inner {
      padding: 36px 40px;
    }

    .modal-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-light);
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 14px;
    }

    .modal-heading {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .modal-tips-card {
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      padding: 16px 20px;
      border-radius: 0 14px 14px 0;
      color: #9a3412;
      font-size: 0.95rem;
      margin-bottom: 26px;
    }

    .modal-body-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #334155;
      white-space: pre-line;
    }

    .empty-prompt {
      text-align: center;
      padding: 80px 0;
      color: var(--text-sub);
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .header-container { flex-direction: column; align-items: stretch; }
      .search-box { width: 100%; }
      .hero-banner { padding: 26px; border-radius: 18px; }
      .hero-banner h2 { font-size: 1.6rem; }
      .articles-grid { grid-template-columns: 1fr; }
      .modal-inner { padding: 24px; }
      .modal-heading { font-size: 1.45rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="#" class="brand-logo">
        <div class="brand-icon">🍳</div>
        <div class="brand-text">
          <h1>VibeLife</h1>
          <span>ẨM THỰC & SỨC KHỎE</span>
        </div>
      </a>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm món ăn, cách làm, mẹo vặt..." oninput="handleSearch()">
      </div>
    </div>
  </header>

  <main class="container">
    
    <div class="hero-banner">
      <h2>Món Ngon Mỗi Ngày & Sống Khỏe Toàn Diện</h2>
      <p>Tổng hợp công thức nấu ăn ngon, hướng dẫn chế biến món ngon gia đình và cẩm nang dinh dưỡng khoa học từ các chuyên gia.</p>
    </div>

    <!-- THANH PHÂN LOẠI CHUYÊN MỤC -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setCategory('Tất cả')">✨ Tất cả bài viết</button>
      <button class="filter-btn" onclick="setCategory('Ẩm thực & Món ngon')">🍲 Món ngon mỗi ngày</button>
      <button class="filter-btn" onclick="setCategory('Dinh dưỡng')">🥑 Dinh dưỡng</button>
      <button class="filter-btn" onclick="setCategory('Mẹo sống khỏe')">🏃 Mẹo sống khỏe</button>
      <button class="filter-btn" onclick="setCategory('Y học đời sống')">🩺 Y học đời sống</button>
    </div>

    <!-- LƯỚI BÀI VIẾT -->
    <div id="articlesContainer" class="articles-grid">
      <div class="empty-prompt">Đang chuẩn bị các món ăn và bài viết mới nhất...</div>
    </div>

  </main>

  <!-- MODAL XEM CHI TIẾT BÀI VIẾT -->
  <div id="articleModal" class="modal-backdrop" onclick="onOverlayClick(event)">
    <div class="modal-dialog">
      <button class="modal-close-icon" onclick="closeModal()">&times;</button>
      <img id="modalImg" class="modal-cover" alt="Ảnh món ăn / bài viết">
      <div class="modal-inner">
        <span id="modalCategory" class="modal-tag"></span>
        <h2 id="modalHeading" class="modal-heading"></h2>
        <div id="modalTipsBox" class="modal-tips-card"></div>
        <div id="modalBodyText" class="modal-body-text"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lleeibzegmnycuingzgx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsZWVpYnplZ21ueWN1aW5nemd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjc5OTUsImV4cCI6MjEwNTcwMzk5NX0.KrO8Y8qoKh0NIPYDL6wki7zGb-Lxi1xwWgQrX9xSXxE";

    let articlesList = [];
    let currentCategory = 'Tất cả';

    async function fetchNews() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?select=*&order=id.desc`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        if (!res.ok) throw new Error("Lỗi kết nối máy chủ");
        articlesList = await res.json();
        renderCards(articlesList);
      } catch (err) {
        document.getElementById("articlesContainer").innerHTML = `
          <div class="empty-prompt">Không thể tải dữ liệu. Xin vui lòng thử lại sau.</div>
        `;
      }
    }

    function renderCards(articles) {
      const container = document.getElementById("articlesContainer");

      if (!articles || articles.length === 0) {
        container.innerHTML = `<div class="empty-prompt">Không tìm thấy bài viết hoặc món ăn nào.</div>`;
        return;
      }

      container.innerHTML = articles.map(item => {
        const isCook = item.category === "Ẩm thực & Món ngon";
        const fallbackImg = isCook 
          ? 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80' 
          : 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=80';

        return `
          <article class="card" onclick="openModal(${item.id})">
            <div class="card-thumb-wrap">
              <span class="card-badge ${isCook ? 'cook' : ''}">${escapeStr(item.category || 'Món ngon')}</span>
              <img class="card-thumb" 
                   src="${item.image_url || fallbackImg}" 
                   alt="${escapeStr(item.title)}" 
                   loading="lazy">
            </div>
            <div class="card-content">
              <h3 class="card-title">${escapeStr(item.title)}</h3>
              <p class="card-summary">${escapeStr(item.summary || '')}</p>
              ${item.tips ? `
                <div class="card-advice">
                  <span>${isCook ? '🍲' : '💡'}</span>
                  <div>${escapeStr(item.tips)}</div>
                </div>
              ` : ''}
              <div class="card-action">
                <span>${isCook ? 'Xem công thức & cách nấu' : 'Đọc toàn bộ bài viết'}</span>
                <span>&rarr;</span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function openModal(id) {
      const art = articlesList.find(a => a.id === id);
      if (!art) return;

      const imgEl = document.getElementById("modalImg");
      if (art.image_url) {
        imgEl.style.display = "block";
        imgEl.src = art.image_url;
      } else {
        imgEl.style.display = "none";
      }

      document.getElementById("modalCategory").innerText = art.category || "Bài viết";
      document.getElementById("modalHeading").innerText = art.title;

      const tipsBox = document.getElementById("modalTipsBox");
      if (art.tips) {
        tipsBox.style.display = "block";
        const isCook = art.category === "Ẩm thực & Món ngon";
        tipsBox.innerHTML = `<strong>${isCook ? 'Bí quyết nấu ngon:' : 'Lời khuyên chuyên gia:'}</strong><br>${escapeStr(art.tips)}`;
      } else {
        tipsBox.style.display = "none";
      }

      document.getElementById("modalBodyText").innerText = art.content || art.summary;

      document.getElementById("articleModal").classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("articleModal").classList.remove("show");
      document.body.style.overflow = "auto";
    }

    function onOverlayClick(e) {
      if (e.target.id === "articleModal") closeModal();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.includes(cat) || (cat === 'Tất cả' && btn.innerText.includes('Tất cả')));
      });
      applyFilter();
    }

    function handleSearch() {
      applyFilter();
    }

    function applyFilter() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = articlesList.filter(item => {
        const matchCategory = (currentCategory === 'Tất cả') || (item.category === currentCategory);
        const matchSearch = item.title.toLowerCase().includes(query) || 
                            (item.summary && item.summary.toLowerCase().includes(query));
        return matchCategory && matchSearch;
      });

      renderCards(filtered);
    }

    function escapeStr(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    fetchNews();
  </script>
</body>
</html>
