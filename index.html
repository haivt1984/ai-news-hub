<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đời Sống & Sức Khỏe - Nhật Báo Cổ Điển</title>

  <!-- Google Fonts: Phông chữ Gothic cho Tiêu Đề Báo & Phông Chân Cổ Điển -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Cinzel:wght@600;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-paper: #f4ecd8;
      --bg-paper-light: #faf5e8;
      --ink: #1f1b18;
      --ink-muted: #574f47;
      --border-dark: #2c2521;
      --accent-vintage: #8c2d19;
      --font-masthead: 'UnifrakturMaguntia', 'Cinzel', serif;
      --font-headline: 'Playfair Display', Georgia, serif;
      --font-body: 'Merriweather', serif;
      --font-sub: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
      background-image: radial-gradient(#dfd4be 10%, transparent 10%);
      background-size: 16px 16px;
      padding-bottom: 80px;
    }

    .paper-sheet {
      max-width: 1240px;
      margin: 30px auto;
      background: var(--bg-paper-light);
      padding: 30px 45px;
      border: 1px solid #d4c5a9;
      box-shadow: 0 10px 30px rgba(44, 37, 33, 0.15), 0 0 150px rgba(0, 0, 0, 0.05) inset;
      position: relative;
    }

    /* ĐƯỜNG VIỀN KÉP ĐẶC TRƯNG BÁO GIẤY */
    .paper-sheet::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px solid var(--border-dark);
      pointer-events: none;
    }

    /* TOP BAR: THÔNG TIN SỐ BÁO / NGÀY THÁNG */
    .newspaper-meta-bar {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 6px;
      font-family: var(--font-sub);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ink-muted);
    }

    /* TIÊU ĐỀ TRANG BÁO (MASTHEAD) */
    .masthead {
      text-align: center;
      padding: 20px 0 12px;
      border-bottom: 5px double var(--border-dark);
    }

    .masthead-title {
      font-family: var(--font-masthead);
      font-size: 4.6rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 2px;
      color: var(--border-dark);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
    }

    .masthead-motto {
      font-family: var(--font-headline);
      font-style: italic;
      font-size: 1.05rem;
      margin-top: 8px;
      color: var(--ink-muted);
    }

    /* THANH ĐIỀU HƯỚNG VÀ DANH MỤC */
    .newspaper-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-dark);
      padding: 10px 0;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .categories-list {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: none;
      border: none;
      font-family: var(--font-sub);
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      color: var(--ink);
      padding: 4px 6px;
      position: relative;
    }

    .cat-btn::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--accent-vintage);
      transition: width 0.2s ease;
    }

    .cat-btn:hover::after, .cat-btn.active::after {
      width: 100%;
    }

    .cat-btn.active {
      color: var(--accent-vintage);
    }

    /* Ô TÌM KIẾM CỔ ĐIỂN */
    .search-container input {
      background: transparent;
      border: 1px solid var(--border-dark);
      padding: 6px 14px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--ink);
      outline: none;
      border-radius: 0;
    }

    .search-container input::placeholder {
      font-style: italic;
      color: #8b8072;
    }

    /* BỐ CỤC LƯỚI TIN BÁO IN */
    .newspaper-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 25px;
    }

    /* TIN NỔI BẬT (HEADLINE CHIẾM 8 CỘT) */
    .article-headline {
      grid-column: span 8;
      border-right: 1px solid #d4c5a9;
      padding-right: 25px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .article-headline .article-title {
      font-size: 2.2rem;
      line-height: 1.2;
      margin: 10px 0 15px;
    }

    .article-headline .article-summary {
      column-count: 2;
      column-gap: 24px;
      text-align: justify;
    }

    /* CỘT PHỤ (CHIẾM 4 CỘT) */
    .headline-sidebar {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* DÒNG BÀI VIẾT BÌNH THƯỜNG (4 CỘT) */
    .article-card {
      grid-column: span 4;
      border-top: 1px solid var(--border-dark);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .article-category-tag {
      font-family: var(--font-sub);
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--accent-vintage);
      letter-spacing: 1px;
    }

    .article-title {
      font-family: var(--font-headline);
      font-weight: 700;
      color: var(--ink);
      margin: 6px 0 10px;
      transition: color 0.15s ease;
    }

    .article-title:hover {
      color: var(--accent-vintage);
    }

    .article-card .article-title {
      font-size: 1.25rem;
      line-height: 1.35;
    }

    .article-summary {
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--ink-muted);
      text-align: justify;
      flex-grow: 1;
    }

    /* HIỆU ỨNG CHỮ HOA ĐẦU ĐOẠN (DROP CAP) */
    .drop-cap::first-letter {
      font-family: var(--font-headline);
      font-size: 3.2rem;
      float: left;
      line-height: 0.8;
      padding-right: 8px;
      padding-top: 4px;
      color: var(--border-dark);
      font-weight: 700;
    }

    /* HỘP MẸO DÂN GIAN & SỨC KHỎE */
    .vintage-advice-box {
      border: 1px dashed var(--border-dark);
      background: #f1e7d0;
      padding: 10px 12px;
      margin-top: 12px;
      font-size: 0.8rem;
      font-style: italic;
    }

    .vintage-advice-box strong {
      font-family: var(--font-sub);
      font-style: normal;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--accent-vintage);
    }

    /* MODAL ĐỌC BÁO PHÓNG SỰ (POPUP) */
    .vintage-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 24, 20, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .vintage-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .vintage-modal-paper {
      background: var(--bg-paper-light);
      max-width: 880px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 3px solid var(--border-dark);
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      padding: 40px 50px;
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: 1px solid var(--border-dark);
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-header-meta {
      font-family: var(--font-sub);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-vintage);
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 8px;
      margin-bottom: 15px;
    }

    .modal-article-title {
      font-family: var(--font-headline);
      font-size: 2.3rem;
      line-height: 1.25;
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-advice {
      border: 1px solid var(--border-dark);
      border-left: 5px solid var(--accent-vintage);
      padding: 14px 18px;
      background: #eee3c8;
      font-size: 0.9rem;
      margin-bottom: 25px;
      font-style: italic;
    }

    .modal-article-content {
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.8;
      text-align: justify;
      white-space: pre-line;
      column-count: 2;
      column-gap: 35px;
    }

    .empty-announcement {
      grid-column: span 12;
      text-align: center;
      padding: 50px;
      font-style: italic;
      color: var(--ink-muted);
    }

    /* ĐIỀU CHỈNH TRÊN THIẾT BỊ DI ĐỘNG */
    @media (max-width: 900px) {
      .paper-sheet { padding: 20px 20px; }
      .masthead-title { font-size: 2.8rem; }
      .article-headline { grid-column: span 12; border-right: none; padding-right: 0; }
      .article-headline .article-summary { column-count: 1; }
      .headline-sidebar { grid-column: span 12; }
      .article-card { grid-column: span 12; }
      .modal-article-content { column-count: 1; }
      .vintage-modal-paper { padding: 25px 20px; }
    }
  </style>
</head>
<body>

  <div class="paper-sheet">
    
    <!-- THANH THỜI GIAN VÀ ẤN PHẨM -->
    <div class="newspaper-meta-bar">
      <span>ẤN BẢN ĐẶC BIỆT NĂM 2026</span>
      <span id="currentDateStr">HÀ NỘI - SÀI GÒN</span>
      <span>GIÁ: 200 ĐỒNG</span>
    </div>

    <!-- TỰA ĐỀ NHẬT BÁO -->
    <header class="masthead">
      <h1 class="masthead-title">Nhật Báo Sức Khỏe</h1>
      <p class="masthead-motto">"Thức Ăn Là Vị Thuốc - Nếp Sống Là Cội Nguồn Bình An"</p>
    </header>

    <!-- THANH ĐIỀU HƯỚNG BÁO CHÍ & TÌM KIẾM -->
    <nav class="newspaper-nav">
      <div class="categories-list">
        <button class="cat-btn active" onclick="setCategory('Tất cả')">Toàn Bộ Tin</button>
        <button class="cat-btn" onclick="setCategory('Y học đời sống')">Y Học Đời Sống</button>
        <button class="cat-btn" onclick="setCategory('Dinh dưỡng')">Dinh Dưỡng</button>
        <button class="cat-btn" onclick="setCategory('Mẹo sống khỏe')">Mẹo Sống Khỏe</button>
        <button class="cat-btn" onclick="setCategory('Ẩm thực & Món ngon')">Ẩm Thực Bốn Phương</button>
      </div>

      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Tra cứu bài viết..." oninput="onSearch()">
      </div>
    </nav>

    <!-- KHU VỰC CÁC CỘT TIN TỨC -->
    <main id="newsLayout" class="newspaper-grid">
      <div class="empty-announcement">Đang chuẩn bị bản in từ các tòa soạn...</div>
    </main>

  </div>

  <!-- POPUP ĐỌC PHÓNG SỰ / BÀI BÁO TOÀN VĂN -->
  <div id="readModal" class="vintage-modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="vintage-modal-paper">
      <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      <div id="modalCategory" class="modal-header-meta"></div>
      <h2 id="modalTitle" class="modal-article-title"></h2>
      <div id="modalAdvice" class="modal-advice"></div>
      <div id="modalContent" class="modal-article-content"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lleeibzegmnycuingzgx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsZWVpYnplZ21ueWN1aW5nemd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjc5OTUsImV4cCI6MjEwNTcwMzk5NX0.KrO8Y8qoKh0NIPYDL6wki7zGb-Lxi1xwWgQrX9xSXxE";

    let articlesData = [];
    let currentCategory = 'Tất cả';

    // In ngày tháng hiện tại theo phong cách báo chí cổ
    function displayDate() {
      const now = new Date();
      const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
      const str = `${days[now.getDay()]}, Ngày ${now.getDate()} Tháng ${now.getMonth() + 1} Năm ${now.getFullYear()}`;
      document.getElementById("currentDateStr").innerText = str.toUpperCase();
    }
    displayDate();

    async function loadNewspaper() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?select=*&order=id.desc`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        if (!res.ok) throw new Error("Lỗi nạp dữ liệu");
        articlesData = await res.json();
        renderLayout(articlesData);
      } catch (e) {
        document.getElementById("newsLayout").innerHTML = `
          <div class="empty-announcement">Tạm thời gián đoạn liên lạc với tòa soạn. Xin quý độc giả trở lại sau.</div>
        `;
      }
    }

    function renderLayout(articles) {
      const layout = document.getElementById("newsLayout");

      if (!articles || articles.length === 0) {
        layout.innerHTML = `<div class="empty-announcement">Không tìm thấy bài báo nào trong số này.</div>`;
        return;
      }

      // 1. Phân chia: Bài đầu tiên làm Headline lớn, 2 bài tiếp làm sidebar, còn lại dàn lưới
      const [headline, sub1, sub2, ...rest] = articles;

      let html = "";

      // Khối Tin Đinh (Headline chính của số báo)
      if (headline) {
        html += `
          <article class="article-headline" onclick="openArticleModal(${headline.id})">
            <span class="article-category-tag">${escapeStr(headline.category || 'Tiêu Điểm')}</span>
            <h2 class="article-title">${escapeStr(headline.title)}</h2>
            <div class="article-summary drop-cap">${escapeStr(headline.summary || '')}</div>
            ${headline.tips ? `<div class="vintage-advice-box"><strong>Mẹo hay đời sống:</strong> ${escapeStr(headline.tips)}</div>` : ''}
          </article>
        `;
      }

      // Cột phụ bên phải headline
      if (sub1 || sub2) {
        html += `<div class="headline-sidebar">`;
        [sub1, sub2].filter(Boolean).forEach(item => {
          html += `
            <div class="article-card" style="border-top: none; border-bottom: 1px solid var(--border-dark); padding-bottom: 14px;" onclick="openArticleModal(${item.id})">
              <span class="article-category-tag">${escapeStr(item.category || 'Ghi Nhận')}</span>
              <h3 class="article-title" style="font-size: 1.15rem;">${escapeStr(item.title)}</h3>
              <p class="article-summary">${escapeStr(item.summary || '')}</p>
            </div>
          `;
        });
        html += `</div>`;
      }

      // Các bài viết tiếp theo dàn theo cột báo truyền thống
      rest.forEach(item => {
        html += `
          <article class="article-card" onclick="openArticleModal(${item.id})">
            <span class="article-category-tag">${escapeStr(item.category || 'Tin Vắn')}</span>
            <h3 class="article-title">${escapeStr(item.title)}</h3>
            <p class="article-summary">${escapeStr(item.summary || '')}</p>
            ${item.tips ? `<div class="vintage-advice-box"><strong>Lời khuyên:</strong> ${escapeStr(item.tips)}</div>` : ''}
          </article>
        `;
      });

      layout.innerHTML = html;
    }

    function openArticleModal(id) {
      const art = articlesData.find(a => a.id === id);
      if (!art) return;

      document.getElementById("modalCategory").innerText = `CHUYÊN MỤC: ${art.category || 'THỜI SỰ Y TẾ'}`;
      document.getElementById("modalTitle").innerText = art.title;

      const advBox = document.getElementById("modalAdvice");
      if (art.tips) {
        advBox.style.display = "block";
        advBox.innerHTML = `<strong>LƯU Ý CỦA TÒA SOẠN:</strong> ${escapeStr(art.tips)}`;
      } else {
        advBox.style.display = "none";
      }

      // Hiển thị nội dung đầy đủ đã cào, nếu chưa có thì dùng summary
      const contentEl = document.getElementById("modalContent");
      contentEl.innerText = art.content || art.summary;
      contentEl.className = "modal-article-content drop-cap";

      document.getElementById("readModal").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("readModal").classList.remove("active");
      document.body.style.overflow = "auto";
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === "readModal") closeModal();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.toLowerCase() === cat.toLowerCase() || (cat === 'Tất cả' && btn.innerText === 'TOÀN BỘ TIN'));
      });
      applyFilters();
    }

    function onSearch() {
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = articlesData.filter(item => {
        const matchCat = (currentCategory === 'Tất cả') || (item.category === currentCategory);
        const matchSearch = item.title.toLowerCase().includes(q) || (item.summary && item.summary.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderLayout(filtered);
    }

    function escapeStr(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    loadNewspaper();
  </script>
</body>
</html>
