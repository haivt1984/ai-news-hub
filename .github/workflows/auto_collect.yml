name: Chạy script cào tin và tóm tắt AI

on:
  schedule:
    # Tự động chạy mỗi 6 tiếng một lần (giờ UTC)
    - cron: '0 */6 * * *'
  # Cho phép bấm nút kích hoạt thủ công trong giao diện GitHub Actions
  workflow_dispatch:

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Chạy script cào tin và lưu Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collector.py
